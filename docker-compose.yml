# Local API and ingestion workers using a Supabase PostgreSQL database and Cloudflare R2.
# All credentials are read from the untracked root .env file. Never commit .env.
services:
  registry-redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  registry-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your Supabase PostgreSQL connection string}
      REDIS_URL: ${REDIS_URL:-redis://registry-redis:6379/0}
      LOCAL_STORAGE_PATH: /app/.registry-uploads
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      DATASOURCE_ENVIRONMENT: ${DATASOURCE_ENVIRONMENT:-sandbox}
    # Do not run migrations automatically against a shared Supabase database.
    # Apply reviewed database/migrations SQL files explicitly before starting.
    command: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      registry-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  registry-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to your Supabase PostgreSQL connection string}
      REDIS_URL: ${REDIS_URL:-redis://registry-redis:6379/0}
      LOCAL_STORAGE_PATH: /app/.registry-uploads
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-2}
      WORKER_MAX_JOBS_PER_RUN: ${WORKER_MAX_JOBS_PER_RUN:-10}
      WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-3}
      WORKER_RETRY_SECONDS: ${WORKER_RETRY_SECONDS:-30}
      WORKER_STALE_AFTER_SECONDS: ${WORKER_STALE_AFTER_SECONDS:-900}
      PDF_OCR_ENABLED: ${PDF_OCR_ENABLED:-false}
      PDF_OCR_MAX_PAGES: ${PDF_OCR_MAX_PAGES:-25}
    command: ["python", "-m", "src.worker"]
    depends_on:
      registry-api:
        condition: service_healthy
      registry-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  registry-frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install --no-package-lock --no-audit --no-fund && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      registry-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    init: true
    restart: unless-stopped

volumes:
  frontend_node_modules:
