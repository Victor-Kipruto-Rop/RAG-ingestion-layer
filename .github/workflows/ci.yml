name: Registry CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt
      - name: Compile backend modules
        run: python -m compileall -q backend/src
      - name: Lint everything for undefined names, unused imports and syntax errors
        run: ruff check --select F,E9 backend tests conftest.py
      - name: Import every entry point (catches broken relative imports)
        run: PYTHONPATH=backend python -c "import src.main, src.worker, src.preflight, src.admin_auth"
      - name: Smoke-test Alembic on disposable SQLite
        working-directory: backend
        run: DATABASE_URL=sqlite:///./ci_migrations.db python -m alembic -c alembic.ini upgrade head
      - name: Run backend test suite (SQLite)
        run: pytest -q
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - name: Build API container
        run: docker build -t pesaguard-registry-api:ci ./backend
      - name: Build worker container
        run: docker build -t pesaguard-registry-worker:ci -f backend/Dockerfile.worker ./backend
  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: registry_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ci:ci@localhost:5432/registry_ci
      TEST_PG_ADMIN_URL: postgresql+psycopg://ci:ci@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt
      - name: Enable pg_trgm for the application database
        run: PGPASSWORD=ci psql -h localhost -U ci -d registry_ci -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm'
      - name: Run the full suite on PostgreSQL, including SQL-migration and RLS checks
        run: pytest -q
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies from the lockfile
        run: npm ci --no-audit --no-fund
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend assets
        run: npm run build
      - name: Audit frontend dependencies
        run: npm audit --audit-level=moderate
      - name: Build production frontend container
        run: docker build --build-arg VITE_API_BASE_URL=https://api.example.invalid -t pesaguard-registry-frontend:ci .
  local-compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare safe local environment
        run: cp .env.example .env
      - name: Validate connected local Docker stack
        shell: bash
        run: |
          docker compose config --quiet
          services="$(docker compose config --services)"
          for service in registry-api registry-worker registry-frontend registry-redis; do
            if ! grep -qx "$service" <<< "$services"; then
              echo "Required local service is missing: $service" >&2
              exit 1
            fi
          done
