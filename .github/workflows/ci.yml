name: Registry CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/modern-datasource-dashboard]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Upgrade pip
        run: python -m pip install --upgrade pip
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Install Ruff
        run: pip install 'ruff>=0.11,<1.0'
      - name: Compile backend modules
        run: python -m compileall -q backend/src
      - name: Lint critical backend modules and regression tests
        run: ruff check --select F backend/src/api.py backend/src/cache.py backend/src/config.py backend/src/database.py backend/src/entity_resolution.py backend/src/main.py backend/src/resilience.py backend/src/security.py backend/src/storage.py backend/src/models.py backend/src/worker.py backend/src/ingestion/normalizer.py backend/src/ingestion/parser_csv.py backend/tests/test_parser_csv_streaming.py backend/tests/test_dlq_sanitization.py backend/tests/test_payload_pii_masking.py backend/tests/test_entity_resolution.py backend/tests/test_resilience.py backend/tests/test_security_hmac.py backend/tests/test_worker_recovery.py tests/test_backend.py $(find backend/src/api_keys.py backend/src/verification.py backend/src/ingestion/parser_xlsx.py backend/tests/test_managed_api_keys.py backend/tests/test_data_quality.py backend/tests/test_xlsx_parser.py backend/tests/test_ingestion_preview.py backend/tests/test_verification.py backend/tests/test_ingestion_retry.py -type f 2>/dev/null || true)
      - name: Smoke-test Alembic on disposable SQLite
        working-directory: backend
        run: DATABASE_URL=sqlite:///./ci_migrations.db python -m alembic -c alembic.ini upgrade head
      - name: Run backend test suite against disposable SQLite
        run: PYTHONPATH=backend DATABASE_URL=sqlite:///./ci_registry.db REGISTRY_API_KEYS=test-secret-key pytest -q
      - name: Build API container
        run: docker build -t pesaguard-registry-api:ci ./backend
      - name: Build worker container
        run: docker build -t pesaguard-registry-worker:ci -f backend/Dockerfile.worker ./backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Test frontend API client
        run: npm test
      - name: Build frontend assets
        run: npm run build
      - name: Build production frontend container
        run: docker build -t pesaguard-registry-frontend:ci .
