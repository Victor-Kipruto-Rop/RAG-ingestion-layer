name: Registry CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/modern-datasource-dashboard]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: registry-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: pip install 'ruff>=0.11,<1.0'
      - run: python -m compileall -q backend/src
      - run: ruff check --select F $(find backend/src backend/tests -name '*.py' -type f) tests/test_backend.py
      - name: Smoke-test Alembic on disposable SQLite
        working-directory: backend
        run: DATABASE_URL=sqlite:///./ci_migrations.db python -m alembic -c alembic.ini upgrade head
      - run: PYTHONPATH=backend DATABASE_URL=sqlite:///./ci_registry.db REGISTRY_API_KEYS=test-secret-key pytest -q
      - name: Build API container
        run: docker build -t pesaguard-registry-api:ci ./backend
      - name: Build worker container
        run: docker build -t pesaguard-registry-worker:ci -f backend/Dockerfile.worker ./backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Build production frontend container
        run: docker build -t pesaguard-registry-frontend:ci .
