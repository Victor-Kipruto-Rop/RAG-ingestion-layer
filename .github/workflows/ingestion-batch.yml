name: Scheduled ingestion batch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Preflight checks only, or explicitly process a batch"
        type: choice
        options:
          - preflight
          - ingest
        default: preflight
        required: true

permissions:
  contents: read

concurrency:
  group: pesaguard-ingestion-batch
  cancel-in-progress: false

jobs:
  ingest:
    name: Process a bounded batch of queued imports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: production
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
      WORKER_MAX_JOBS_PER_RUN: "10"
      WORKER_MAX_ATTEMPTS: "3"
      WORKER_RETRY_SECONDS: "30"
      WORKER_STALE_AFTER_SECONDS: "900"
      PDF_OCR_ENABLED: "true"
      PDF_OCR_MAX_PAGES: "25"

    steps:
      - name: Check required secrets are configured
        shell: bash
        run: |
          set -euo pipefail
          for name in DATABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_ENDPOINT_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required GitHub Actions secret ${name} is missing."
              exit 1
            fi
          done

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install Tesseract OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends tesseract-ocr
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Non-destructive production preflight
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'preflight'
        run: python -m src.preflight

      - name: Process eligible ingestion jobs
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.run_mode == 'ingest')
        run: python -m src.worker --batch
