# Safe local Windows development stack.
# Uses a shared SQLite database and local file storage. It does NOT connect to
# Supabase or Cloudflare R2, even if production credentials exist in .env.
services:
  registry-api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/data/registry.db
      LOCAL_STORAGE_PATH: /app/.registry-uploads
      CORS_ORIGINS: "http://localhost:${REGISTRY_FRONTEND_HOST_PORT:-5176},http://127.0.0.1:${REGISTRY_FRONTEND_HOST_PORT:-5176}"
      ADMIN_FRONTEND_URL: "http://localhost:${REGISTRY_FRONTEND_HOST_PORT:-5176}"
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_ENDPOINT_URL: ""
    command: ["sh", "-c", "python -m alembic -c alembic.ini upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "127.0.0.1:${REGISTRY_API_HOST_PORT:-8002}:8000"
    networks:
      - default
      - pesaguard
    volumes:
      - registry_data:/app/data
      - registry_uploads:/app/.registry-uploads
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  registry-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    env_file:
      - .env
    environment:
      APP_ENV: development
      DATABASE_URL: sqlite:////app/data/registry.db
      LOCAL_STORAGE_PATH: /app/.registry-uploads
      R2_ACCOUNT_ID: ""
      R2_ACCESS_KEY_ID: ""
      R2_SECRET_ACCESS_KEY: ""
      R2_BUCKET_NAME: ""
      R2_ENDPOINT_URL: ""
      WORKER_POLL_SECONDS: "2"
      WORKER_MAX_JOBS_PER_RUN: "10"
      WORKER_MAX_ATTEMPTS: "3"
      WORKER_RETRY_SECONDS: "30"
      WORKER_STALE_AFTER_SECONDS: "900"
      PDF_OCR_ENABLED: "true"
      PDF_OCR_MAX_PAGES: "25"
    command: ["python", "-m", "src.worker"]
    volumes:
      - registry_data:/app/data
      - registry_uploads:/app/.registry-uploads
    depends_on:
      registry-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - pesaguard

  registry-frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: "http://localhost:${REGISTRY_API_HOST_PORT:-8002}"
    ports:
      - "127.0.0.1:${REGISTRY_FRONTEND_HOST_PORT:-5176}:5173"
    depends_on:
      registry-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  registry_data:
  registry_uploads:
  frontend_node_modules:

networks:
  default: {}
  pesaguard:
    external: true
    name: pesaguard-local_default
