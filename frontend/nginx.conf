server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS is only honoured over HTTPS, so it is safe to send from behind a TLS-terminating proxy.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # connect-src allows https: so the dashboard can reach the API origin and presigned R2 uploads;
    # tighten it to your exact API and bucket origins in production.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    # `expires` (unlike add_header) does not reset the inherited security headers above.
    location / { try_files $uri $uri/ /index.html; expires -1; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable" always; add_header X-Content-Type-Options nosniff always; try_files $uri =404; }
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
}
