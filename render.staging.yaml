# Explicit staging-only blueprint. Do not apply to production services.
# Creating these resources may incur Render charges; review plan choices before syncing.
services:
  - type: keyvalue
    name: pesaguard-datasource-staging-redis
    region: singapore
    plan: 256mb
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: pesaguard-datasource-staging-api
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/ready
    preDeployCommand: python -m alembic -c alembic.ini upgrade head
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: pesaguard-datasource-staging-shared
      - key: DATABASE_URL
        fromDatabase:
          name: pesaguard-datasource-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pesaguard-datasource-staging-redis
          type: keyvalue
          property: connectionString
      - key: API_ENVIRONMENT
        value: sandbox
      - key: CORS_ORIGINS
        value: https://pesaguard-datasource-staging-frontend.onrender.com
      - key: PUBLIC_BASE_URL
        value: https://pesaguard-datasource-staging-api.onrender.com
      - key: DEVELOPER_OAUTH_CALLBACK_BASE_URL
        value: https://pesaguard-datasource-staging-api.onrender.com
      - key: ADMIN_FRONTEND_URL
        value: https://pesaguard-datasource-staging-frontend.onrender.com
      - key: DEVELOPER_FRONTEND_URL
        value: https://pesaguard-datasource-staging-frontend.onrender.com
      - key: DEVELOPER_PUBLIC_BASE_URL
        value: https://pesaguard-datasource-staging-api.onrender.com
      - key: DEVELOPER_PRODUCTION_BASE_URL
        value: https://api.pesaguard.co.ke
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SIGNUP_ALLOWED_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
  - type: worker
    name: pesaguard-datasource-staging-worker
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile.worker
    autoDeployTrigger: checksPass
    envVars:
      - fromGroup: pesaguard-datasource-staging-shared
      - key: DATABASE_URL
        fromDatabase:
          name: pesaguard-datasource-staging-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: pesaguard-datasource-staging-redis
          type: keyvalue
          property: connectionString
      - key: API_ENVIRONMENT
        value: sandbox
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

  - type: web
    name: pesaguard-datasource-staging-frontend
    runtime: static
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    envVars:
      - key: VITE_API_BASE_URL
        value: https://pesaguard-datasource-staging-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY

databases:
  - name: pesaguard-datasource-staging-db
    databaseName: registry_staging
    user: registry_staging
    postgresMajorVersion: "16"
    region: singapore
    plan: 0.1c-256mb
    ipAllowList: []

envVarGroups:
  - name: pesaguard-datasource-staging-shared
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: PesaGuard Datasource Staging
      - key: REGISTRY_API_KEYS
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_OTP_PEPPER
        generateValue: true
      - key: DEVELOPER_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: DEVELOPER_WEBHOOK_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: API_KEY_AUTH_JWT_ISSUER
        value: pesaguard
      - key: API_KEY_AUTH_JWT_AUDIENCE
        value: pesaguard-api
      - key: REQUIRE_HMAC
        value: "false"
      - key: PDF_OCR_ENABLED
        value: "false"
