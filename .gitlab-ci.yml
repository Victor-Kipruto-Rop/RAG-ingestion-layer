stages:
  - validate
  - test
  - build
  - deploy
  - operations

workflow:
  rules:
    # Merge-request validation runs without deployment or operational jobs.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # Staging branch supports push, web/manual, and scheduled pipelines.
    - if: '$CI_COMMIT_BRANCH == "chore/production-ci-release-gates"'
    - when: never

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  DOCKER_TLS_CERTDIR: "/certs"

.python-job:
  image: python:3.12-slim
  cache:
    key: "pip-$CI_COMMIT_REF_SLUG"
    paths:
      - .cache/pip/
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r backend/requirements-dev.txt

backend-checks:
  extends: .python-job
  stage: validate
  timeout: 30m
  script:
    - python -m compileall -q backend/src
    - ruff check --select F,E9 backend tests conftest.py
    - PYTHONPATH=backend python -c "import src.main, src.worker, src.preflight, src.admin_auth"
    - cd backend && DATABASE_URL=sqlite:///./ci_migrations.db python -m alembic -c alembic.ini upgrade head
    - cd ..
    - pytest -q
    - pip-audit -r backend/requirements.txt

backend-postgres-tests:
  extends: .python-job
  stage: test
  timeout: 30m
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_USER: ci
    POSTGRES_PASSWORD: ci
    POSTGRES_DB: registry_ci
    TEST_DATABASE_URL: "postgresql+psycopg://ci:ci@postgres:5432/registry_ci"
    TEST_PG_ADMIN_URL: "postgresql+psycopg://ci:ci@postgres:5432/postgres"
  script:
    - |
      python - <<'PY'
      import os, time
      import psycopg
      dsn = "postgresql://ci:ci@postgres:5432/registry_ci"
      for attempt in range(30):
          try:
              with psycopg.connect(dsn, connect_timeout=2) as conn:
                  conn.execute("CREATE EXTENSION IF NOT EXISTS pg_trgm")
              print("PostgreSQL is ready and pg_trgm is enabled.")
              break
          except Exception:
              if attempt == 29:
                  raise
              time.sleep(2)
      PY
    - pytest -q

frontend-tests:
  image: node:22-bookworm-slim
  stage: test
  timeout: 30m
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  variables:
    VITE_API_BASE_URL: "https://staging-api.example.invalid"
  script:
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm test
    - npm run build
    - npm audit --audit-level=moderate
  artifacts:
    when: always
    paths:
      - frontend/dist/
    expire_in: 1 day

sdk-tests:
  extends: .python-job
  stage: test
  timeout: 20m
  script:
    - pip install -e "sdks/python[test]"
    - pytest -q sdks/python/sdk_client_tests.py
    - apt-get update && apt-get install -y --no-install-recommends nodejs npm
    - node --test sdks/javascript/test/client.test.js

staging-blueprint-validation:
  image: ruby:3.3-slim
  stage: validate
  script:
    - |
      ruby - <<'RUBY'
      require "yaml"
      blueprint = YAML.load_file("render.staging.yaml")
      services = blueprint.fetch("services")
      required = [
        "pesaguard-datasource-staging-api",
        "pesaguard-datasource-staging-worker",
        "pesaguard-datasource-staging-frontend",
        "pesaguard-datasource-staging-redis"
      ]
      names = services.map { |service| service.fetch("name") }
      missing = required - names
      abort "Missing staging services: #{missing.join(', ')}" unless missing.empty?
      api = services.find { |service| service["name"] == "pesaguard-datasource-staging-api" }
      abort "API must use /health/ready" unless api["healthCheckPath"] == "/health/ready"
      abort "Staging must deploy only after CI passes" unless api["autoDeployTrigger"] == "checksPass"
      env = api.fetch("envVars").select { |entry| entry["key"] }.to_h { |entry| [entry["key"], entry["value"]] }
      abort "Staging API must use sandbox key validation" unless env["API_ENVIRONMENT"] == "sandbox"
      abort "Staging must not reuse production base URL" unless env["DEVELOPER_PUBLIC_BASE_URL"] != env["DEVELOPER_PRODUCTION_BASE_URL"]
      abort "A separate staging database is required" unless blueprint.fetch("databases").any? { |db| db["name"] == "pesaguard-datasource-staging-db" }
      frontend = services.find { |service| service["name"] == "pesaguard-datasource-staging-frontend" }
      abort "Frontend must use a Render static site build" unless frontend["runtime"] == "static"
      abort "Frontend must publish built assets" unless frontend["staticPublishPath"] == "./dist"
      abort "Frontend must provide SPA route fallback" unless frontend.fetch("routes", []).any? { |route| route["type"] == "rewrite" && route["source"] == "/*" && route["destination"] == "/index.html" }
      abort "Staging frontend API URL is not configured as expected" unless frontend.fetch("envVars", []).any? { |entry| entry["key"] == "VITE_API_BASE_URL" }
      puts "Staging blueprint structure and release gates validated."
      RUBY

docker-builds:
  image: docker:27-cli
  stage: build
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  timeout: 30m
  script:
    - docker info
    - docker build -t pesaguard-datasource-api:ci ./backend
    - docker build -t pesaguard-datasource-worker:ci -f backend/Dockerfile.worker ./backend
    - docker build --build-arg VITE_API_BASE_URL=https://staging-api.example.invalid -t pesaguard-datasource-frontend:ci ./frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "chore/production-ci-release-gates"'

cloudflare-pages-staging:
  image: node:22-bookworm-slim
  stage: deploy
  environment:
    name: staging
  cache:
    key: "npm-$CI_COMMIT_REF_SLUG"
    paths:
      - .npm/
  before_script:
    - test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN CI/CD variable" && exit 1)
    - test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID CI/CD variable" && exit 1)
    - test -n "$VITE_API_BASE_URL" || (echo "Missing VITE_API_BASE_URL CI/CD variable; set the actual staging API URL" && exit 1)
    - cd frontend
    - npm ci --no-audit --no-fund
    - npm run build
    - cd ..
  script:
    - npx --yes wrangler pages deploy frontend/dist --project-name=pesaguard-datasource-staging --branch=staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "chore/production-ci-release-gates"'
      when: manual
    - when: never
  allow_failure: false

# Safe-by-default replacement for the old scheduled ingestion workflow.
# It never uses production credentials. Configure staging-only DATABASE_URL and
# R2 variables in GitLab before enabling this manual job.
staging-ingestion-preflight:
  image: python:3.12-slim
  stage: operations
  timeout: 10m
  environment:
    name: staging
  variables:
    APP_ENV: staging
    PYTHONUNBUFFERED: "1"
  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
  script:
    - test -n "$DATABASE_URL" || (echo "Set staging-only DATABASE_URL in GitLab CI/CD variables" && exit 1)
    - python -m src.preflight
  rules:
    - if: '$CI_COMMIT_BRANCH == "chore/production-ci-release-gates"'
      when: manual
    - when: never

staging-ingestion-batch:
  image: python:3.12-slim
  stage: operations
  timeout: 10m
  environment:
    name: staging
  variables:
    APP_ENV: staging
    PYTHONUNBUFFERED: "1"
    WORKER_MAX_JOBS_PER_RUN: "10"
    WORKER_MAX_ATTEMPTS: "3"
    WORKER_RETRY_SECONDS: "30"
    WORKER_STALE_AFTER_SECONDS: "900"
    PDF_OCR_ENABLED: "true"
    PDF_OCR_MAX_PAGES: "25"
  before_script:
    - cd backend
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - apt-get update && apt-get install -y --no-install-recommends tesseract-ocr
  script:
    - |
      set -eu
      for name in DATABASE_URL R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET_NAME R2_ENDPOINT_URL; do
        eval "value=\${$name:-}"
        if [ -z "$value" ]; then
          echo "Missing staging CI/CD variable: $name" >&2
          exit 1
        fi
      done
    - python -m src.worker --batch
  rules:
    - if: '$CI_COMMIT_BRANCH == "chore/production-ci-release-gates"'
      when: manual
    - when: never
  allow_failure: false
