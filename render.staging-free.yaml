# Free-tier staging API only. This does NOT provision paid services.
# Uses the existing free Redis service and existing Supabase staging database.
# No worker is included because Render background workers do not have a free plan.
# Async ingestion will not drain its queue until a worker is deliberately provisioned.
services:
  - type: web
    name: pesaguard-datasource-staging-api
    runtime: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /health/ready
    autoDeployTrigger: off
    envVars:
      - fromGroup: pesaguard-datasource-staging-free-shared
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: pesaguard-datasource-staging-redis
          type: keyvalue
          property: connectionString
      - key: API_ENVIRONMENT
        value: sandbox
      - key: CORS_ORIGINS
        value: https://pesaguard-datasource-staging.pages.dev
      - key: PUBLIC_BASE_URL
        value: https://pesaguard-datasource-staging-api.onrender.com
      - key: DEVELOPER_OAUTH_CALLBACK_BASE_URL
        value: https://pesaguard-datasource-staging-api.onrender.com
      - key: ADMIN_FRONTEND_URL
        value: https://pesaguard-datasource-staging.pages.dev
      - key: DEVELOPER_FRONTEND_URL
        value: https://pesaguard-datasource-staging.pages.dev
      - key: DEVELOPER_PUBLIC_BASE_URL
        value: https://pesaguard-datasource-staging-api.onrender.com
      - key: DEVELOPER_PRODUCTION_BASE_URL
        value: https://api.pesaguard.co.ke
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: ADMIN_SIGNUP_ALLOWED_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false

envVarGroups:
  - name: pesaguard-datasource-staging-free-shared
    envVars:
      - key: APP_ENV
        value: staging
      - key: APP_NAME
        value: PesaGuard Datasource Staging
      - key: REGISTRY_API_KEYS
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: AUTH_OTP_PEPPER
        generateValue: true
      - key: DEVELOPER_ACCESS_TOKEN_SECRET
        generateValue: true
      - key: DEVELOPER_WEBHOOK_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_TTL_SECONDS
        value: "28800"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: API_KEY_AUTH_JWT_ISSUER
        value: pesaguard
      - key: API_KEY_AUTH_JWT_AUDIENCE
        value: pesaguard-api
      - key: REQUIRE_HMAC
        value: "false"
      - key: PDF_OCR_ENABLED
        value: "false"
